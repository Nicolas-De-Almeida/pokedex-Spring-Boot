spring.application.name=pokedex-api
server.port=${PORT:8080}

# Lê as variáveis de um arquivo backend/.env (não versionado), se ele existir
spring.config.import=optional:file:.env[.properties]

# MongoDB: a connection string (com usuário e senha do Atlas) vem da variável MONGODB_URI
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pokedex}
spring.data.mongodb.database=${MONGODB_DATABASE:pokedex}

# Origens liberadas no CORS (frontend React + Vite)
pokedex.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Popula o MongoDB a partir do Script_Pokedex.sql quando a coleção "pokemons" estiver vazia.
# Com SEED_RESET=true as coleções são apagadas e recriadas a cada inicialização.
pokedex.seed.enabled=${SEED_ENABLED:true}
pokedex.seed.reset=${SEED_RESET:false}
pokedex.seed.script=classpath:Script_Pokedex.sql
